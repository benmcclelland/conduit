transfer:
  # duration of interval between each lease extension
  expiry-interval: 30s
  # the number in bytes that the conduit server will accept for a source. This is useful for preventing users from providing an extremely large number of sources (ex: wildcard usage in slurm plugin)
  max-source-bytes: 131072
# filesystem plugin configurations
filesystems:
  # an arbitrary name for the filesystem
  default:
    # a regex pattern used to match the provided path from the user on the FE
    user-path: .*
    # a regex substitution for mapping the user FE path to the equivalent FTA path
    fta-path: $0
    # a regex substitution for the root of the filesystem. This is used for symlink following
    fta-root-fs-path: /
    plugin-stages:
      # this plugin will be used for each path during validation
      validation: posix
      # this plugin will be used for each source path during setup
      setup-src: posix
      # this plugin will be used for the destination path during setup
      setup-dst: posix
      # this list of plugins determines which plugin will be used for the sources. conduit-fta will use the first common plugin between the sources and destination to execute the transfer
      transfer-src:
        - pftool
      # this list of plugins determines which plugin will be used for the destination. conduit-fta will use the first common plugin between the sources and destination to execute the transfer
      transfer-dst:
        - pftool
      # this plugin will be used for each source path during teardown
      teardown-src: posix
      # this plugin will be used for the destination path during teardown
      teardown-dst: posix
    # any plugin specfic configs go down here
    custom-plugin-config:
      # the posix plugin allows for moving sources to a trash location instead of removing during teardown
      posix-src-trash: ""
      # when setup-src or transfer-src uses scoutam, the server-side ScoutFS directory represented by fta-root-fs-path;
      # ScoutAM stage requests use this server-side path (for example, /server/scoutfs/dir)
      # scoutam-api-root: /server/scoutfs
plugins:
  pftool:
    # path to pfcp binary
    pfcp-path: /etc/pftool/bin/pfcp
    # optional args for pfcp invocations ( will follow src/dest arg list and possible '-R' )
    pfcp-args:
      - "-s"
      - "--conduit"
    # the pftool plugin will kill pftool if it sees no change in file chunks after this many hours
    no-progress-timeout-hours: 1
  rsync:
    # path to rsync binary
    rsync-path: rsync
  scoutam:
    # base URL of the ScoutAM REST API (FTA hosts are not expected to have samcli or gRPC access to ScoutAM)
    api-base-url: https://127.0.0.1:8080
    # ScoutAM account used to authenticate to the REST API
    api-username: admin
    # password for api-username
    api-password: password
    # skip TLS certificate verification for the ScoutAM API (needed for self-signed certs)
    api-insecure-skip-verify: true
    # NATS server(s) that ScoutAM is configured to publish stage notifications to (see `samcli notify nats --stage`)
    nats-servers:
      - 127.0.0.1:4222
    # prefix for the unique per-transfer NATS topic used to correlate stage completion notifications
    nats-stage-topic-prefix: conduit.stage
    # setup-src: scoutam - max time to wait on stage notifications for all requested files before failing setup
    # transfer-src: scoutam - max time to go without any stage notification while files are still pending
    stage-timeout: 30m
    # max number of files per batchstage API request (and per rsync invocation in transfer mode); directories are split into multiple requests of this size
    batch-size: 1000
    # rsync binary used when scoutam is the transfer plugin (stages and copies each file as soon as it's online)
    rsync-path: rsync
    # cancel still-pending stage requests (PUT /v1/scheduler/stagecancelfiles) when stage-timeout fires.
    # Needs an operator (or higher) ScoutAM account. Cancels are per file, so other requesters' stages of
    # the same files are cancelled too. Files whose stage job is already running still come online.
    cancel-stage-on-timeout: false
  marchive:
    # The MarFS object list generation command
    objlist-path: mustang
    tmrequest-path: marchive-tmrequest
